name: URL batch ingestion tests

on:
  pull_request:
    paths:
      - "patches/patch_vce_url_batch_ingestion.py"
      - "tests/test_vce_url_batch_ingestion.py"
      - ".github/workflows/url-batch-ingestion-tests.yml"
  push:
    branches:
      - feat/vk-url-batch-ingestion-20261102
    paths:
      - "patches/patch_vce_url_batch_ingestion.py"
      - "tests/test_vce_url_batch_ingestion.py"
      - ".github/workflows/url-batch-ingestion-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-tests
        run: python patches/patch_vce_url_batch_ingestion.py --self-test
      - name: Regression tests
        run: python -m unittest tests/test_vce_url_batch_ingestion.py -v
