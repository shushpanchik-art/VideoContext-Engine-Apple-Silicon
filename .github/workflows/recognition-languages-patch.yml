name: Recognition languages patch tests

on:
  pull_request:
    paths:
      - "VideoContextEngine_v3.19.py"
      - "videocontext_web_ui.html"
      - "patches/vce-recognition-languages-patcher.tar.gz"
      - "tests/test_vce_recognition_languages_patch.py"
      - ".github/workflows/recognition-languages-patch.yml"
  push:
    branches: [main]
    paths:
      - "VideoContextEngine_v3.19.py"
      - "videocontext_web_ui.html"
      - "patches/vce-recognition-languages-patcher.tar.gz"
      - "tests/test_vce_recognition_languages_patch.py"
      - ".github/workflows/recognition-languages-patch.yml"

permissions:
  contents: read

jobs:
  patch-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate patch transforms against current runtime and UI
        run: python -m unittest discover -s tests -p "test_vce_recognition_languages_patch.py" -v
