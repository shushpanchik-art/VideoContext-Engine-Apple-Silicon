name: Temporary pinned VCE runner detail inspection

on:
  push:
    branches:
      - feat/experimental-benchmark-launcher
    paths:
      - ".github/workflows/inspect-pinned-vce-runner.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect exact classifier inputs in pinned runner
        run: |
          python - <<'PY'
          import ast, gzip
          from pathlib import Path
          source = gzip.decompress(Path("scripts/vce_full_profile_benchmark.py.gz").read_bytes()).decode("utf-8")
          tree = ast.parse(source)
          lines = source.splitlines()
          wanted = {"stage_metrics", "build_base_fields", "build_plan", "make_markdown", "write_csv"}
          for node in tree.body:
              if isinstance(node, ast.FunctionDef) and node.name in wanted:
                  print(f"===== {node.name} ({node.lineno}-{node.end_lineno}) =====")
                  print("\\n".join(lines[node.lineno-1:node.end_lineno]))
          PY
