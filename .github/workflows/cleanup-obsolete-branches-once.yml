name: One-time cleanup of superseded research branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-obsolete-branches-once.yml"

permissions:
  contents: write

jobs:
  delete-reviewed-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only reviewed, superseded branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "benchmark/vce-results-summary-20261024"
            "feat/macos-native-window-confirm-quit"
            "feat/macos-native-window-quit-confirm"
            "feat/mlx-metal-runtime-20261026"
            "feat/vce-bounded-frame-prefetch-20261025"
            "feat/vce-parallel-cpu-asr-vlm-20261025"
            "feat/vce-quality-benchmark-harness"
            "fix/mlx-vlm-thread-affinity-20261026"
            "fix/mlx-vlm-thread-affinity-custom-20261026"
            "fix/vce-audio-resilience-acceleration-v6"
            "fix/vce-benchmark-prompt-limits-and-icon"
            "fix/vce-metal-memory-media-recovery-20261025"
            "fix/vce-prompt-limits-icon-20261026-clean"
            "review/text-llm-quality-bundle-20261027"
          )
          for branch in "${branches[@]}"; do
            gh api --silent -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted superseded branch: ${branch}"
          done

      - name: Remove this one-time cleanup workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_path=".github/workflows/cleanup-obsolete-branches-once.yml"
          blob_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}" --jq .sha)"
          gh api --silent -X DELETE "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}" \
            -f message="chore: remove one-time branch cleanup workflow" \
            -f sha="${blob_sha}" \
            -f branch="main"
