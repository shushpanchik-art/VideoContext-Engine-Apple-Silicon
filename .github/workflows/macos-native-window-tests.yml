name: macOS native app window tests

on:
  push:
    branches: [main, "feat/macos-native-window-confirm-quit"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  native-window:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Type-check the native WKWebView app
        run: swiftc -parse-as-library -typecheck -framework AppKit -framework WebKit macos/VideoContextWebView.swift
      - name: Check shell script syntax
        run: |
          bash -n macos/VideoContextLauncher.sh
          bash -n scripts/install_native_window_app.command
          bash -n "macos/VideoContext Engine.app/Contents/MacOS/VideoContextLauncher"
      - name: Test launcher and safe installer anchors
        run: python3 -m unittest discover -s tests -p "test_macos_native_window.py" -v
