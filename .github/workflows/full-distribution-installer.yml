# Validates the optional llama.cpp/Metal backend, verbose offload evidence, and private NSR forensic runner.
name: Full distribution installer validation

on:
  pull_request:
    paths:
      - "scripts/install_video_context_engine.command"
      - "macos/install_video_context_mac.command"
      - "macos/VideoContext Engine.app/Contents/Resources/start_server.command"
      - "macos/VideoContext Engine.app/Contents/Resources/VideoContextStatusBar.swift"
      - "macos/repair_installed_native_app.command"
      - "requirements-apple-silicon.txt"
      - "config/videocontext_settings.apple_silicon.example.json"
      - "README.md"
      - "CHANGELOG.md"
      - "COMMIT_INFO.txt"
      - "PUBLICATION_PACKAGE_MANIFEST.json"
      - "TEST_STATUS.md"
      - "docs/INSTALL_FROM_PUBLIC_REPO.md"
      - "tests/test_vce_public_installer.py"
      - "tests/test_vce_stop_mps_patch.py"
      - "tests/test_vce_repository_hygiene.py"
      - "tests/test_vce_metal_timeout_guard.py"
      - "patches/patch_vce_stop_and_mps.py"
      - "VideoContextEngine_v3.19.py"
      - "videocontext_web_ui.html"
      - "requirements-llama-cpp-metal.txt"
      - "docs/LLAMA_CPP_METAL_BACKEND.md"
      - "tests/test_llama_cpp_metal_backend.py"
      - "scripts/vce_run_nsrspec_llama_cpp.command"
      - "scripts/vce_observed_llama_cpp_run.py"
      - "scripts/vce_runtime_watchdog.py"
      - "tests/test_vce_llama_cpp_nsrspec_runner.py"
      - "docs/MEMORY_SAFETY_AND_VIDEO_COMPATIBILITY.md"
      - "docs/MLX_METAL_DIAGNOSTICS.md"
      - ".github/workflows/cleanup-merged-topic-branches.yml"
      - ".github/workflows/full-distribution-installer.yml"
  push:
    branches: [main]
    paths:
      - "scripts/install_video_context_engine.command"
      - "macos/install_video_context_mac.command"
      - "macos/VideoContext Engine.app/Contents/Resources/start_server.command"
      - "macos/VideoContext Engine.app/Contents/Resources/VideoContextStatusBar.swift"
      - "macos/repair_installed_native_app.command"
      - "requirements-apple-silicon.txt"
      - "config/videocontext_settings.apple_silicon.example.json"
      - "README.md"
      - "CHANGELOG.md"
      - "COMMIT_INFO.txt"
      - "PUBLICATION_PACKAGE_MANIFEST.json"
      - "TEST_STATUS.md"
      - "docs/INSTALL_FROM_PUBLIC_REPO.md"
      - "tests/test_vce_public_installer.py"
      - "tests/test_vce_stop_mps_patch.py"
      - "tests/test_vce_metal_timeout_guard.py"
      - "patches/patch_vce_stop_and_mps.py"
      - "VideoContextEngine_v3.19.py"
      - "scripts/vce_run_nsrspec_llama_cpp.command"
      - "scripts/vce_observed_llama_cpp_run.py"
      - "scripts/vce_runtime_watchdog.py"
      - "tests/test_vce_llama_cpp_nsrspec_runner.py"
      - "docs/MEMORY_SAFETY_AND_VIDEO_COMPATIBILITY.md"
      - "docs/MLX_METAL_DIAGNOSTICS.md"
      - "tests/test_vce_repository_hygiene.py"
      - ".github/workflows/cleanup-merged-topic-branches.yml"
      - ".github/workflows/full-distribution-installer.yml"

permissions:
  contents: read

jobs:
  native-swift-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile AppKit/WebKit status-bar app
        run: |
          xcrun swiftc -O "macos/VideoContext Engine.app/Contents/Resources/VideoContextStatusBar.swift" \
            -framework AppKit -framework WebKit \
            -o "$RUNNER_TEMP/VideoContextStatusBar"

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate shell scripts
        run: |
          bash -n scripts/install_video_context_engine.command
          bash -n macos/install_video_context_mac.command
          bash -n "macos/VideoContext Engine.app/Contents/Resources/start_server.command"
      - name: Validate example JSON
        run: python -m json.tool config/videocontext_settings.apple_silicon.example.json >/dev/null
      - name: Validate publication package manifest
        run: python -m json.tool PUBLICATION_PACKAGE_MANIFEST.json >/dev/null
      - name: Validate llama.cpp forensic runner scripts
        run: |
          bash -n scripts/vce_run_nsrspec_llama_cpp.command
          python -m py_compile scripts/vce_observed_llama_cpp_run.py scripts/vce_runtime_watchdog.py
          python -m unittest discover -s tests -p "test_vce_llama_cpp_nsrspec_runner.py" -v
      - name: Compile engine runtime
        run: python -m py_compile VideoContextEngine_v3.19.py
      - name: Run llama.cpp backend isolation tests
        run: python -m unittest discover -s tests -p "test_llama_cpp_metal_backend.py" -v
      - name: Run installer contract tests
        run: |
          python -m unittest discover -s tests -p "test_vce_public_installer.py" -v
          python -m unittest discover -s tests -p "test_vce_stop_mps_patch.py" -v
          python -m unittest discover -s tests -p "test_vce_metal_timeout_guard.py" -v
          python -m unittest discover -s tests -p "test_vce_repository_hygiene.py" -v
