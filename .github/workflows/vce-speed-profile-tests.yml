name: VCE speed profile and macOS menu bar tests

on:
  pull_request:
    paths:
      - "patches/archive/patch_vce_speed_profile.py"
      - "patches/archive/patch_vce_defaults.py"
      - "patches/archive/patch_vce_quality_prompt.py"
      - "patches/archive/patch_vce_memory_safety.py"
      - "tests/test_vce_quality_prompt.py"
      - "tests/test_vce_native_app_lifecycle.py"
      - "docs/**"
      - "macos/**"
      - "tests/test_vce_speed_profile.py"
      - "tests/test_vce_memory_safety.py"
      - "VideoContextEngine_v3.19.py"
      - "vce_core/**"
      - "tests/fixtures/reconcile/**"
      - "tests/test_vce_pipeline_contract.py"
      - "tests/test_vce_text_core_golden.py"
      - "tests/test_vce_mlx_wired_limit.py"
      - "tests/test_vce_mlx_device_diagnostic.py"
      - ".github/workflows/vce-speed-profile-tests.yml"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - "patches/archive/patch_vce_speed_profile.py"
      - "patches/archive/patch_vce_defaults.py"
      - "patches/archive/patch_vce_quality_prompt.py"
      - "tests/test_vce_quality_prompt.py"
      - "docs/**"
      - "macos/**"
      - "tests/test_vce_speed_profile.py"
      - "tests/test_vce_native_app_lifecycle.py"
      - "VideoContextEngine_v3.19.py"
      - "vce_core/**"
      - "tests/fixtures/reconcile/**"
      - "tests/test_vce_pipeline_contract.py"
      - "tests/test_vce_text_core_golden.py"
      - "tests/test_vce_mlx_wired_limit.py"
      - "tests/test_vce_mlx_device_diagnostic.py"
      - ".github/workflows/vce-speed-profile-tests.yml"
      - "scripts/**"

jobs:
  config-and-bundle-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test reversible VLM speed profile
        run: python -m unittest discover -s tests -p "test_vce_*.py" -v
      - name: Validate patcher syntax
        run: python -m py_compile patches/archive/patch_vce_speed_profile.py patches/archive/patch_vce_defaults.py patches/archive/patch_vce_quality_prompt.py patches/archive/patch_vce_memory_safety.py scripts/vce_unattended_benchmark.py
      - name: Validate installer shell syntax
        run: bash -n macos/install_video_context_mac.command macos/repair_installed_native_app.command
