name: Cleanup merged and fully integrated topic branches

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete merged or obsolete integrated topic branches
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR branches and orphaned branches already in main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.default_branch;

            const [closedPulls, openPulls, branches] = await Promise.all([
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: "closed", per_page: 100
              }),
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: "open", per_page: 100
              }),
              github.paginate(github.rest.repos.listBranches, {
                owner, repo, per_page: 100
              })
            ]);

            const openHeads = new Set(openPulls
              .filter(pr => pr.head.repo?.full_name === `${owner}/${repo}`)
              .map(pr => pr.head.ref));
            const mergedHeads = new Set();

            for (const pr of closedPulls) {
              if (!pr.merged_at) continue;
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) continue;
              if (!pr.head.ref || pr.head.ref === defaultBranch) continue;
              if (openHeads.has(pr.head.ref)) continue;
              mergedHeads.add(pr.head.ref);
            }

            const deleted = new Set();

            async function deleteBranch(ref, reason) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${ref}`
                });
                deleted.add(ref);
                core.info(`Deleted topic branch: ${ref} (${reason})`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Branch absent/protected/not deletable: ${ref}`);
                  return;
                }
                throw error;
              }
            }

            // First: the established rule for branches attached to merged PRs.
            for (const ref of [...mergedHeads].sort()) {
              await deleteBranch(ref, "PR merged");
            }

            // Second: clean abandoned refs whose commits are already reachable
            // from main. Limit this to topic prefixes; preserve release/maintenance
            // branches, the default branch, protected branches and every open PR.
            const topicPrefixes = [
              "chore/", "fix/", "feature/", "docs/", "test/",
              "perf/", "refactor/", "hotfix/", "benchmark/"
            ];

            for (const branch of branches.sort((a, b) => a.name.localeCompare(b.name))) {
              const ref = branch.name;
              if (!ref || ref === defaultBranch) continue;
              if (branch.protected) {
                core.info(`Preserved protected branch: ${ref}`);
                continue;
              }
              if (openHeads.has(ref) || deleted.has(ref)) {
                core.info(`Preserved open-PR or already handled branch: ${ref}`);
                continue;
              }
              if (!topicPrefixes.some(prefix => ref.startsWith(prefix))) continue;

              const comparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: defaultBranch,
                head: ref
              });

              // ahead_by === 0 means the topic branch has no commit absent from
              // main. Behind branches are safe to delete; ahead branches are kept.
              if (comparison.data.ahead_by !== 0) {
                core.info(`Preserved branch with unique commits: ${ref} (ahead_by=${comparison.data.ahead_by})`);
                continue;
              }

              await deleteBranch(ref, `fully integrated (behind_by=${comparison.data.behind_by})`);
            }

            core.info(`Deleted ${deleted.size} topic branch(es); preserved default, protected, open-PR and divergent branches.`);
