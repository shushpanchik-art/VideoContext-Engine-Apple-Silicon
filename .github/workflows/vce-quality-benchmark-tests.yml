name: VCE quality benchmark tests

on:
  push:
    branches: [main, "feat/vce-quality-benchmark-harness", "fix/vce-benchmark-prompt-limits-and-icon"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax of benchmark and quality guards
        run: python -m py_compile tools/bench_text_llm_summary.py tools/quality_check_text_llm_variants.py tools/evaluate_text_llm_grounding.py patches/patch_vce_text_llm_quality_guard.py
      - name: Check icon installer shell syntax
        run: bash -n scripts/install_vce_macos_icon.command
      - name: Run benchmark and icon unit tests
        run: python -m unittest discover -s tests -p "test_vce_*.py" -v
